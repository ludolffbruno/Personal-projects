<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cálculo ST/DIFAL</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        .resultado { color: green; font-size: 18px; }
        .resumo { font-size: 16px; }
    </style>
</head>
<body>
    <h1>Cálculo ST/DIFAL para Compras</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Buscar (NCM ou Produto):</label><br>
        <input type="text" name="ncm" list="ncm_list" required>
        <datalist id="ncm_list">
            {% for ncm in ncm_list %}
                <option value="{{ ncm.ncm }}">{{ ncm.produto }}</option>
            {% endfor %}
        </datalist><br><br>

        <label>ST Inclusa na compra?</label>
        <input type="checkbox" name="st_inclusa"><br><br>

        <label>Origem ICMS:</label>
        <select name="origem_icms">
            <option value="0%">0%</option>
            <option value="4%">4%</option>
            <option value="12%">12%</option>
            <option value="22%">22%</option>
        </select><br><br>

        <label>Custo Unitário:</label>
        <input type="text" name="custo_unitario" required><br><br>

        <button type="submit">Calcular</button>
    </form>

    {% if resumo %}
        <p class="resumo"><strong>Selecionados:</strong> {{ resumo }}</p>
    {% endif %}
    {% if resultado %}
        <p class="resultado"><strong>Custo Final:</strong> {{ resultado }}</p>
    {% endif %}
</body>
</html>
